model_list:
  # Phase 1: Small local/cheap model via Ollama for triage & student distillation target
  - model_name: tier-1-fast
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: http://ollama:11434

  # Phase 1: Frontier / larger model for complex SCA journey diagnosis & teacher data generation
  - model_name: tier-2-reasoning
    litellm_params:
      model: ollama_chat/deepseek-r1:7b
      api_base: http://ollama:11434

  # Phase 1: Dedicated alias for DeepEval LLM-as-a-judge metrics
  - model_name: eval-judge
    litellm_params:
      model: ollama_chat/llama3.1:8b
      api_base: http://ollama:11434

litellm_settings:
  drop_params: true
  cache: true
  cache_params:
    type: redis
    host: deepeval-cache
    port: 6379
